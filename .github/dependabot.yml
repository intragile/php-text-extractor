version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    # Only the development tools; the runtime version constraints are maintained by hand.
    # widen keeps the older majors in "^11.0|^12.0" style constraints, which the matrix still uses.
    allow:
      - dependency-type: development
    versioning-strategy: widen
    groups:
      dev-dependencies:
        patterns: ["*"]
